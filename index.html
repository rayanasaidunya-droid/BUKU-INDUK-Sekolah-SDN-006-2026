<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUKU INDUK Sekolah SDN 006 SUNGAI BULUH2026</title>
    <meta name="description" content="Sistem Informasi Manajemen Buku Induk Siswa Sekolah Indonesia terpadu untuk pendataan siswa, raport, mutasi, dan ijazah." />
    <meta property="og:title" content="BUKU INDUK Sekolah SDN 006 SUNGAI BULUH2026" />
    <meta property="og:description" content="Sistem Informasi Manajemen Buku Induk Siswa Sekolah Indonesia terpadu untuk pendataan siswa, raport, mutasi, dan ijazah." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('buku_induk_dark_mode_v1');
          if (saved !== null) {
            if (JSON.parse(saved) === true) {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.style.colorScheme = 'light';
            }
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-blue-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
